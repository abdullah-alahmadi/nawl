[package]
name = "texloom-docx"
description = "Exports Texloom documents to Microsoft Word (.docx), right-to-left included"
version.workspace = true
edition.workspace = true

[dependencies]
texloom-core = { path = "../core" }
texloom-codegen = { path = "../codegen" }
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
png = "0.18"

[dev-dependencies]
serde_json.workspace = true
