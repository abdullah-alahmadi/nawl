[package]
name = "nawl-cli"
description = "Command-line tool: render Nawl documents to PDF, export LaTeX, check templates"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "nawl-cli"
path = "src/main.rs"

[dependencies]
nawl-core = { path = "../core" }
nawl-codegen = { path = "../codegen" }
nawl-compile = { path = "../compile" }
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }
anyhow = "1"
