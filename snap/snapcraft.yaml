# Nawl as a snap, made from the .deb that `tauri build` produces (CI copies it to
# snap/local/nawl.deb first; see .github/workflows/packages.yml).
#
# Strict confinement: Nawl compiles with its bundled Tectonic, which downloads TeX
# packages (network). A TeX Live installed on the system isn't visible inside the
# snap, so Settings → Preview offers Tectonic only there.
name: nawl
base: core22
version: '0.1.1'
title: Nawl
summary: Visual LaTeX editor with a no-code template designer
description: |
  Nawl is a visual (WYSIWYG) LaTeX editor in the spirit of LyX. Write reports,
  journal articles, theses and beamer presentations on a page that looks like the
  PDF, design templates without code, and compile with the bundled Tectonic.
license: Proprietary
grade: stable
confinement: strict
architectures:
  - build-on: amd64

# WebKitGTK looks for its helper processes at a fixed path.
layout:
  /usr/lib/$SNAPCRAFT_ARCH_TRIPLET/webkit2gtk-4.1:
    bind: $SNAP/usr/lib/$SNAPCRAFT_ARCH_TRIPLET/webkit2gtk-4.1

apps:
  nawl:
    command: usr/bin/nawl
    desktop: usr/share/applications/Nawl.desktop
    extensions: [gnome]
    plugs:
      - home
      - removable-media
      - network
      - opengl

parts:
  nawl:
    plugin: dump
    source: snap/local/nawl.deb
    source-type: deb
    stage-packages:
      - libwebkit2gtk-4.1-0
    override-prime: |
      craftctl default
      # The menu entry's icon, as a path inside the snap.
      sed -i 's|^Icon=nawl$|Icon=${SNAP}/usr/share/icons/hicolor/128x128/apps/nawl.png|' usr/share/applications/Nawl.desktop
