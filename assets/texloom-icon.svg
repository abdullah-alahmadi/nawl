<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b5bdb"/>
      <stop offset="1" stop-color="#1e2f7a"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef1fb"/>
    </linearGradient>
  </defs>
  <!-- Rounded square -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <!-- Threads (the loom): warp and weft behind the page -->
  <g stroke="#ffd166" stroke-width="26" stroke-linecap="round" opacity="0.9">
    <line x1="150" y1="330" x2="874" y2="330"/>
    <line x1="150" y1="694" x2="874" y2="694"/>
  </g>
  <!-- Page with a folded corner -->
  <path d="M300 180 H640 L760 300 V844 H300 Z" fill="url(#page)"/>
  <path d="M640 180 V300 H760 Z" fill="#c9d2f2"/>
  <!-- Threads pass in front of the page edges, woven -->
  <g stroke="#ffd166" stroke-width="26" stroke-linecap="round">
    <line x1="300" y1="694" x2="420" y2="694"/>
    <line x1="640" y1="330" x2="760" y2="330"/>
  </g>
  <!-- The T -->
  <text x="530" y="700" text-anchor="middle" font-family="DejaVu Serif" font-weight="bold" font-size="460" fill="#1e2f7a">T</text>
</svg>
