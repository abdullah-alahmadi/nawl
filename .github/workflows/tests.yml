# Runs the tests on every push to main and on pull requests: the frontend type check
# and build, then the Rust tests of the whole workspace. The tests that compile real
# PDFs (marked ignored) are not run here; they need the TeX package bundle.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch replaces the run in progress.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (Ubuntu)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: npm ci
      # The app's crate needs the built frontend and the TeX engine's file to compile.
      - name: Frontend type check and build
        run: npm run build
      - name: Tectonic (bundled TeX engine)
        run: bash scripts/fetch-tectonic.sh x86_64-unknown-linux-gnu
      - name: Rust tests
        run: cargo test --workspace
      # The tests regenerate the TypeScript bindings; a difference means they were
      # not committed with the Rust change.
      - name: Bindings are up to date
        run: git diff --exit-code -- src/bindings
