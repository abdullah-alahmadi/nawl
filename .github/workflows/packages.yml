# Builds Texloom's packages: the Ubuntu .deb and the snap (from that .deb), and the
# Windows installers (.exe made with NSIS, and .msi). Run it from the Actions tab
# ("Run workflow"), or push a version tag (git tag v0.1.0 && git push --tags) to also
# get a draft GitHub release with the packages attached.
name: Packages

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  linux:
    name: Ubuntu .deb
    # The oldest supported Ubuntu, so the .deb runs on 22.04 and newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: npm ci
      - name: Tectonic (bundled TeX engine)
        run: bash scripts/fetch-tectonic.sh x86_64-unknown-linux-gnu
      - name: Build
        run: npm run tauri build -- --bundles deb
      - uses: actions/upload-artifact@v4
        with:
          name: texloom-deb
          path: target/release/bundle/deb/*.deb

  snap:
    name: Snap
    needs: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: texloom-deb
          path: deb
      - name: The .deb the snap is made from
        run: |
          mkdir -p snap/local
          cp deb/*.deb snap/local/texloom.deb
      - uses: snapcore/action-build@v1
        id: snap
      - uses: actions/upload-artifact@v4
        with:
          name: texloom-snap
          path: ${{ steps.snap.outputs.snap }}

  windows:
    name: Windows installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: npm ci
      - name: Tectonic (bundled TeX engine)
        shell: bash
        run: bash scripts/fetch-tectonic.sh x86_64-pc-windows-msvc
      - name: Build
        run: npm run tauri build -- --bundles nsis,msi
      - uses: actions/upload-artifact@v4
        with:
          name: texloom-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, snap, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: packages/*
