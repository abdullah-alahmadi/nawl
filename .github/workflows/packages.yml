# Builds Nawl's packages:
# - Linux: the .deb (Debian, Ubuntu), the .rpm (Fedora, openSUSE), the AppImage (most
#   distributions, no install) and the snap (made from the .deb);
# - Windows: the installers (.exe made with NSIS, and .msi);
# - macOS: a universal .dmg (Apple Silicon and Intel), not signed by Apple yet.
# Run it from the Actions tab ("Run workflow"), or push a version tag
# (git tag v0.1.2 && git push origin v0.1.2) to also get a draft GitHub release with
# the packages attached.
name: Packages

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  linux:
    name: Linux (.deb, .rpm, AppImage)
    # The oldest supported Ubuntu, so the packages run on 22.04 and newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          # libfuse2 and file: the AppImage tools.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 file
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: npm ci
      - name: Tectonic (bundled TeX engine)
        run: bash scripts/fetch-tectonic.sh x86_64-unknown-linux-gnu
      - name: TeX packages for compiling offline
        run: node scripts/build-tex-cache.mjs
      - name: Arabic font library
        run: |
          python3 -m pip install fonttools
          node scripts/fetch-fonts.mjs
      - name: Build
        run: npm run tauri build -- --bundles deb,rpm,appimage
      # One artifact per format, so each file lands at the top of the release.
      - uses: actions/upload-artifact@v4
        with:
          name: nawl-deb
          path: target/release/bundle/deb/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: nawl-rpm
          path: target/release/bundle/rpm/*.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: nawl-appimage
          path: target/release/bundle/appimage/*.AppImage

  snap:
    name: Snap
    needs: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nawl-deb
          path: deb
      - name: The .deb the snap is made from
        run: |
          mkdir -p snap/local
          cp deb/*.deb snap/local/nawl.deb
      - uses: snapcore/action-build@v1
        id: snap
      - uses: actions/upload-artifact@v4
        with:
          name: nawl-snap
          path: ${{ steps.snap.outputs.snap }}

  windows:
    name: Windows installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: npm ci
      - name: Tectonic (bundled TeX engine)
        shell: bash
        run: bash scripts/fetch-tectonic.sh x86_64-pc-windows-msvc
      - name: TeX packages for compiling offline
        shell: bash
        run: node scripts/build-tex-cache.mjs
      - name: Arabic font library
        shell: bash
        run: |
          python -m pip install fonttools
          node scripts/fetch-fonts.mjs
      - name: Build
        run: npm run tauri build -- --bundles nsis,msi
      - uses: actions/upload-artifact@v4
        with:
          name: nawl-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi

  macos:
    name: macOS (universal .dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
      - run: npm ci
      # One app for both kinds of Mac: Tauri builds each chip and joins them, and the
      # bundled engine must be joined the same way.
      - name: Tectonic (both chips, joined)
        run: |
          bash scripts/fetch-tectonic.sh aarch64-apple-darwin
          bash scripts/fetch-tectonic.sh x86_64-apple-darwin
          lipo -create -output src-tauri/binaries/nawl-tectonic-universal-apple-darwin \
            src-tauri/binaries/nawl-tectonic-aarch64-apple-darwin src-tauri/binaries/nawl-tectonic-x86_64-apple-darwin
      - name: TeX packages for compiling offline
        run: node scripts/build-tex-cache.mjs
      # Homebrew's Python refuses pip installs, so use a separate one.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Arabic font library
        run: |
          python -m pip install fonttools
          PYTHON=python node scripts/fetch-fonts.mjs
      - name: Build
        run: npm run tauri build -- --target universal-apple-darwin --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: nawl-macos
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, snap, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          # The Windows installers sit in nsis/ and msi/ subfolders of their artifact.
          files: |
            packages/*.deb
            packages/*.rpm
            packages/*.AppImage
            packages/*.snap
            packages/*.dmg
            packages/nsis/*.exe
            packages/msi/*.msi
