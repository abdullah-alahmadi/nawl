# Publishes the project website (site/, assembled by scripts/build-site.sh) to GitHub
# Pages at https://abdullah-alahmadi.github.io/nawl/. GitHub's free plan only serves
# Pages for public repositories, so while the repository is private the job is skipped.
# One-time setup once it's public: Settings → Pages → Source: GitHub Actions.
name: Website

on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/images/**
      - assets/**
      - scripts/build-site.sh
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces one that is waiting.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: bash scripts/build-site.sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
